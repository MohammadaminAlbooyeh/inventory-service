name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # inventory-service depends on com.platform:java-common-lib, a sibling module
      # in the platform monorepo. Install it into the local repo when it is checked
      # out alongside this service.
      - name: Install java-common-lib (if present)
        run: |
          for dir in ../shared/java-common-lib ./shared/java-common-lib ../java-common-lib; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Building $dir"
              mvn -B -q -f "$dir/pom.xml" -DskipTests install
              break
            fi
          done

      - name: Build and test
        run: mvn -B verify
